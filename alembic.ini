# Alembic configuration file
# Migration management for Pre-Visit Voice Agent

[alembic]
# path to migration scripts
script_location = alembic

# template to use to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the constructor of datetime.datetime
# Leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field when generating a migration file
# name. The default value is "40" which results
# in the following 40 character names,
# "1234567890123456789012345678901234567890"
# "ABCD"
# "12345678901234567890"
# "abcd"
# When using the datestamp token
# "2016011018120712"
# "%%(rev)s_%%(slug)s.py"
# results in the following 24 character names:
# "20160110181207_12345_add_xyz"
# "20160110181207_1234567890abc"
# "20160110181207_add_xyz_12345"
#max_length = 40

# A variant of file_template that supports directory generation.  By default
# "{ts}_{slug}.py".  works the same way as the main file_template but lets the slogan
# contain path separators.  File will be output to the migrations folder and then
# appended to each component.
# When you configure the sqlalchemy.url setting, the [loggers] entries below will not be used.
# Instead, the configuration will come from the SQL connection string.

sqlalchemy.url = sqlite:///./conversations.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
